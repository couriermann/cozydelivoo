name: cozygame
description: "The Cozy Courier - A cozy delivery game built with Flutter and Flame."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.7"

dependencies:
  flutter:
    sdk: flutter

  # Flame Game Engine
  flame: ^1.34.0
  flame_audio: ^2.11.12

  # Local Storage
  hive_ce: ^2.18.0
  hive_ce_flutter: ^2.3.4

  # Icons
  google_fonts: ^7.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  # Android adaptive icon settings
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  # Remove alpha channel for Play Store compliance
  remove_alpha_ios: true
  # Web favicon
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#E74C3C"
  # Windows icon
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256
  # macOS icon
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  # Assets for the game
  assets:
    - assets/images/
    - assets/audio/
