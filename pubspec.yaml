name: cozygame
description: "The Cozy Courier - A cozy delivery game built with Flutter and Flame."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: ">=3.38.5"

dependencies:
  flutter:
    sdk: flutter

  # Flame Game Engine
  flame: ^1.34.0
  flame_audio: ^2.11.12

  # Local Storage
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.4

  # Icons
  google_fonts: ^7.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets for the game
  assets:
    - assets/images/
    - assets/audio/
